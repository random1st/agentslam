# [[providers]]
# id = "entra"
# kind = "entra"
# tenant_id = "00000000-0000-0000-0000-000000000000"
# client_id = "11111111-1111-1111-1111-111111111111"
# client_secret_env = "AGENTSLAM_ENTRA_SECRET"
# admin_group = "<group object id>"  # optional

[oauth]
# CIMD client metadata URLs allowed to obtain codes (Claude Code, Codex).
allowed_clients = [
  "https://claude.ai/oauth/claude-code-client-metadata",
  # "https://chatgpt.com/oauth/codex/<id>/client.json",
]
access_token_ttl_s = 3600
refresh_token_ttl_s = 2592000
code_ttl_s = 60

# Admins by upstream identity (issuer, sub) — never by email.
