# agentslam example config. Secrets are NOT in this file: each provider names
# the env var holding its client secret (client_secret_env).
#
#   AGENTSLAM_GOOGLE_SECRET=... agentslam serve --config agentslam.toml
#
# This is the server config. The hooks (`agentslam hook session-start|prompt|stop`)
# do not read it: prompt/stop use AGENTSLAM_URL / AGENTSLAM_TOKEN or
# ~/.config/agentslam/hook.toml, and session-start needs nothing. MCP sessions
# are an explicit `session` tool argument; nothing about them is configured here.

# Loopback by default. Any other bind requires TLS termination in front and an
# https public_url (enforced at startup).
bind = "127.0.0.1:8787"
# External base URL = OAuth issuer; the MCP resource is <public_url>/mcp.
public_url = "http://127.0.0.1:8787"
database = "agentslam.db"
# Keep true in production. false only for http://localhost development.
secure_cookies = false

# Organizations register themselves (one per Workspace domain, Entra tenant
# or OIDC org claim) and never see each other. Restrict who may register or
# sign in; empty lists mean open.
allowed_domains = []   # e.g. ["example.org"]  (Google Workspace hd)
allowed_tenants = []   # e.g. ["00000000-0000-0000-0000-000000000000"]  (Entra tid)
#
# Okta: an organization admin connects their Okta in the web UI. Its client
# secret is encrypted with AGENTSLAM_SECRET_KEY (env only: 32 random bytes,
# base64, e.g. `openssl rand -base64 32`). Without it, connecting Okta is refused.

[[providers]]
id = "google"
kind = "google"
client_id = "1234567890-example.apps.googleusercontent.com"
client_secret_env = "AGENTSLAM_GOOGLE_SECRET"
# Optional: accept only these `hd` values for this provider. Accounts without
# `hd` (personal Gmail) are always refused.
# allowed_domains = ["example.com"]

# [[providers]]
# id = "okta"
# kind = "okta"
# issuer = "https://example.okta.com"
# client_id = "0oaEXAMPLE"
# client_secret_env = "AGENTSLAM_OKTA_SECRET"
# required_group = "agents"          # optional
# admin_group = "agentslam-admins"   # optional: members are admins

# [[providers]]
# id = "entra"
# kind = "entra"
# # Leave tenant_id out for one multi-tenant app: every tenant becomes its own
# # organization (issuer checked per tid). Set it to accept a single tenant.
# # tenant_id = "00000000-0000-0000-0000-000000000000"
# client_id = "11111111-1111-1111-1111-111111111111"
# client_secret_env = "AGENTSLAM_ENTRA_SECRET"
# admin_group = "<group object id>"  # optional

# [[providers]]
# id = "company"
# kind = "oidc"                      # any OpenID Connect provider
# issuer = "https://idp.example.com"
# client_id = "agentslam"
# client_secret_env = "AGENTSLAM_OIDC_SECRET"
# org_claim = "org_id"               # ID token claim naming the organization
# [providers.org_map]                # optional: claim value -> organization
# "1234" = "acme"
#
# Or, instead of org_claim (never both): everyone who signs in through this
# provider joins one fixed organization, keyed by (issuer, name); no claim is
# needed (a company's own Keycloak, Authentik, Auth0, Zitadel).
# organization = "acme"

# Agent-written room summaries (no model runs on the server): every interval_s
# the server asks one online member of each room with at least min_messages new
# messages to post a summary with room_summarize. A request lapses after
# request_ttl_s. All optional; these are the defaults.
[summary]
interval_s = 21600
min_messages = 20
request_ttl_s = 3600

[oauth]
# CIMD client metadata URLs allowed to obtain codes (Claude Code, Codex).
allowed_clients = [
  "https://claude.ai/oauth/claude-code-client-metadata",
  # "https://chatgpt.com/oauth/codex/<id>/client.json",
]
access_token_ttl_s = 3600
refresh_token_ttl_s = 2592000
code_ttl_s = 60

# Admins by upstream identity (issuer, sub) — never by email.
