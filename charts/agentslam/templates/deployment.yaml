apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "agentslam.fullname" . }}
  labels:
    {{- include "agentslam.labels" . | nindent 4 }}
spec:
  # SQLite: exactly one writer.
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "agentslam.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "agentslam.selectorLabels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        checksum/config: {{ include "agentslam.config" . | sha256sum }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      automountServiceAccountToken: false
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: agentslam
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: RUST_LOG
              value: {{ .Values.logLevel | quote }}
            {{- if .Values.secretEnv }}
            {{- $secret := required "existingSecret is required when secretEnv is set" .Values.existingSecret }}
            {{- range .Values.secretEnv }}
            - name: {{ .name }}
              valueFrom:
                secretKeyRef:
                  name: {{ $secret }}
                  key: {{ .key }}
            {{- end }}
            {{- end }}
            {{- if .Values.secretKeyKey }}
            - name: AGENTSLAM_SECRET_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ required "existingSecret is required when secretKeyKey is set" .Values.existingSecret }}
                  key: {{ .Values.secretKeyKey }}
            {{- end }}
          volumeMounts:
            - name: config
              mountPath: /etc/agentslam
              readOnly: true
            - name: data
              mountPath: /data
          readinessProbe:
            tcpSocket:
              port: http
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: config
          configMap:
            name: {{ include "agentslam.fullname" . }}
        - name: data
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Values.persistence.existingClaim | default (include "agentslam.fullname" .) }}
          {{- else }}
          emptyDir: {}
          {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
