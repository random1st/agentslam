# agentslam Helm values. The server keeps state in SQLite, so it always runs as
# one replica with a Recreate rollout.

image:
  repository: ghcr.io/random1st/agentslam
  # Defaults to the chart appVersion.
  tag: ""
  pullPolicy: IfNotPresent

imagePullSecrets: []

# External base URL. It is the OAuth issuer and the MCP resource is <publicUrl>/mcp.
# Required. Must be https: put TLS termination (Ingress, a tunnel, a load balancer) in front.
publicUrl: ""

# Company sign-in providers, written exactly as [[providers]] entries of
# agentslam.toml. Never put a client secret here: name an environment variable in
# client_secret_env and map it from a Secret in secretEnv below.
providers: []
#  - id: google
#    kind: google
#    client_id: "1234567890-abc.apps.googleusercontent.com"
#    client_secret_env: AGENTSLAM_GOOGLE_SECRET
#    allowed_domains: ["example.com"]
#  - id: okta
#    kind: okta
#    issuer: "https://example.okta.com"
#    client_id: "0oaEXAMPLE"
#    client_secret_env: AGENTSLAM_OKTA_SECRET
#  - id: entra
#    kind: entra
#    tenant_id: "00000000-0000-0000-0000-000000000000"
#    client_id: "11111111-1111-1111-1111-111111111111"
#    client_secret_env: AGENTSLAM_ENTRA_SECRET

# An existing Secret holding the provider client secrets, and how its keys map to
# the environment variables named in client_secret_env. The chart never creates it.
existingSecret: ""
secretEnv: []
#  - name: AGENTSLAM_GOOGLE_SECRET
#    key: google-client-secret

oauth:
  # Client metadata URLs allowed to sign agents in. `*` stands for one path segment.
  allowedClients:
    - https://claude.ai/oauth/claude-code-client-metadata
    - https://chatgpt.com/oauth/codex/*/client.json
  accessTokenTtlS: 3600
  refreshTokenTtlS: 2592000
  codeTtlS: 60

# Admins by upstream identity (issuer, sub), never by email.
admins: []
#  - issuer: https://accounts.google.com
#    sub: "104857600000000000000"

persistence:
  enabled: true
  size: 5Gi
  # Empty means the cluster default StorageClass.
  storageClass: ""
  # Use an existing PVC instead of creating one.
  existingClaim: ""

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
  #  - secretName: agentslam-tls
  #    hosts: [agentslam.example.com]

logLevel: info

resources:
  requests:
    cpu: 50m
    memory: 64Mi
  limits:
    memory: 256Mi

podAnnotations: {}
podLabels: {}
nodeSelector: {}
tolerations: []
affinity: {}
